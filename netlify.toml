[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Search-enabled advisor needs headroom for web search. 26s requires Netlify Pro AND a one-time
# support activation (the toml value alone does not take effect until support enables it for the site).
# Harmless on the default 10s limit: the plain streaming advisor (/api/advisor) still works there.
[functions."advisor-search"]
  timeout = 26

# Gear research (anthropic.js) runs one kuiu.com web search inside the model call, which routinely takes
# longer than the default 10 s. Same caveat as above: 26 s only takes effect on Pro after support enables
# it; on the default limit the research call may 502/504 on slow lookups (the app shows a retry hint).
[functions."anthropic"]
  timeout = 26
